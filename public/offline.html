<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<title>Offline · CJ Hub</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a;text-align:center}
@media (prefers-color-scheme:dark){body{background:#0d0f15;color:#e2e8f0}}
.logo{width:84px;height:84px;border-radius:22px;margin:0 auto 20px;display:block}
h1{font-size:1.5rem;margin:0 0 8px}p{margin:0 0 20px;opacity:.7}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 24px;background:#0ea5e9;color:#fff;cursor:pointer}
</style>
</head>
<body>
<main>
<img class="logo" src="/icons/icon-192.png" alt="">
<h1>You're offline</h1>
<p>CJ Hub needs a connection to load this page. Check your network and try again.</p>
<button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
