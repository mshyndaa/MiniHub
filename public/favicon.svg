<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MiniHub fairy icon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <path id="spark" d="M0-1 C.12-.25 .25-.12 1 0 C.25 .12 .12 .25 0 1 C-.12 .25 -.25 .12 -1 0 C-.25-.12 -.12-.25 0-1Z"/>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#sky)"/>

  <!-- soft glow -->
  <circle cx="256" cy="262" r="210" fill="url(#glow)"/>

  <!-- wings -->
  <g fill="url(#wing)" stroke="#fff" stroke-opacity="0.8" stroke-width="5" stroke-linejoin="round">
    <path d="M246 258 C170 130 70 120 62 188 C56 244 150 288 246 270Z"/>
    <path d="M246 276 C180 300 110 372 150 404 C190 432 238 350 248 288Z"/>
    <path d="M266 258 C342 130 442 120 450 188 C456 244 362 288 266 270Z"/>
    <path d="M266 276 C332 300 402 372 362 404 C322 432 274 350 264 288Z"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round">
    <path d="M238 262 C190 200 130 168 96 176"/>
    <path d="M274 262 C322 200 382 168 416 176"/>
  </g>

  <!-- star body -->
  <path d="M256 150 L284 226 L364 230 L302 280 L322 358 L256 314 L190 358 L210 280 L148 230 L228 226Z"
        fill="url(#gold)" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="256" cy="262" r="22" fill="#fff" fill-opacity="0.85"/>

  <!-- sparkles -->
  <g fill="#fff">
    <use href="#spark" transform="translate(96 96) scale(30)"/>
    <use href="#spark" transform="translate(420 84) scale(20)"/>
    <use href="#spark" transform="translate(432 408) scale(28)"/>
    <use href="#spark" transform="translate(84 400) scale(18)"/>
    <circle cx="150" cy="60" r="6"/>
    <circle cx="470" cy="236" r="6"/>
    <circle cx="40" cy="268" r="5"/>
    <circle cx="300" cy="456" r="6"/>
  </g>
</svg>
